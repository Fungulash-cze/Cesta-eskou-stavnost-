<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vývoj českých ústav - 8-bit Edice</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
        
        :root {
            --bg-base: #2a1614;
            --bg-panel: #351e1b;
            --accent: #f25c38;
            --text-main: #f3e6dd;
            --text-muted: #a68c85;
            
            --font-ui: 'Press Start 2P', cursive;
            --font-text: 'VT323', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            image-rendering: pixelated;
        }

        body {
            font-family: var(--font-text);
            background-color: var(--bg-base);
            color: var(--text-main);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: row;
        }

        .game-view {
            flex: 1;
            position: relative;
            overflow: hidden;
            background-image: linear-gradient(rgba(243, 230, 221, 0.03) 2px, transparent 2px),
                              linear-gradient(90deg, rgba(243, 230, 221, 0.03) 2px, transparent 2px);
            background-size: 32px 32px;
        }

        .codex {
            width: 600px;
            flex-shrink: 0;
            background-color: var(--bg-panel);
            border-left: 6px solid var(--accent);
            box-shadow: -12px 0px 0px rgba(0,0,0,0.3);
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
            z-index: 50;
        }

        .codex::-webkit-scrollbar { width: 16px; }
        .codex::-webkit-scrollbar-track { background: var(--bg-panel); border-left: 4px solid var(--text-muted); }
        .codex::-webkit-scrollbar-thumb { background: var(--accent); border: 4px solid var(--bg-panel); }

        .hud {
            position: absolute;
            top: 2rem;
            left: 2rem;
            z-index: 100;
            text-shadow: 4px 4px 0px rgba(0,0,0,0.5);
        }

        h1 {
            font-family: var(--font-ui);
            font-size: 1.5rem;
            color: var(--accent);
            line-height: 1.5;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 1.5rem;
            color: var(--text-muted);
        }

        .controls {
            position: absolute;
            bottom: 2rem;
            left: 2rem;
            z-index: 100;
            display: flex;
            gap: 1rem;
        }

        .btn {
            background-color: var(--bg-panel);
            border: 4px solid var(--accent);
            color: var(--text-main);
            font-family: var(--font-ui);
            font-size: 0.8rem;
            padding: 1rem;
            cursor: pointer;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.6);
            transition: transform 0.1s;
        }

        .btn:active:not(:disabled) {
            transform: translate(4px, 4px);
            box-shadow: 2px 2px 0px rgba(0,0,0,0.6);
        }

        .btn:hover:not(:disabled) {
            background-color: var(--accent);
            color: var(--bg-base);
        }

        .btn:disabled {
            border-color: var(--text-muted);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.3);
        }

        .party-hud {
            position: absolute;
            top: 2rem;
            right: 2rem;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            background-color: rgba(53, 30, 27, 0.85);
            border: 4px solid var(--text-muted);
            padding: 1.5rem;
            box-shadow: 8px 8px 0px rgba(0,0,0,0.5);
            min-width: 320px;
            max-height: calc(100vh - 4rem);
            overflow-y: auto;
        }

        .party-hud::-webkit-scrollbar { width: 8px; }
        .party-hud::-webkit-scrollbar-track { background: var(--bg-panel); border-left: 2px solid var(--text-muted); }
        .party-hud::-webkit-scrollbar-thumb { background: var(--accent); }

        .leader-card {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
        }

        .leader-avatar {
            width: 40px;
            height: 40px;
            background-color: var(--bg-base);
            border: 4px solid var(--accent);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: var(--font-ui);
            font-size: 1rem;
            color: var(--text-main);
            box-shadow: inset 4px 4px 0 rgba(0,0,0,0.5);
            flex-shrink: 0;
            margin-top: 0.2rem;
        }

        .leader-info {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .leader-role {
            font-family: var(--font-ui);
            font-size: 0.65rem;
            color: var(--accent);
            margin-bottom: 0.8rem;
            text-transform: uppercase;
        }

        .leader-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .leader-item {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .l-name {
            font-size: 1.4rem;
            color: var(--text-main);
        }

        .l-term {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-top: 0.1rem;
        }

        .world-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 6000px;
            height: 2000px;
            transition: transform 0.6s steps(20);
            transform-origin: 0 0;
        }

        .path-line {
            position: absolute;
            background-color: var(--bg-panel);
            border: 2px solid var(--text-muted);
            z-index: 1;
        }

        .path-line.visited {
            background-color: var(--accent);
            border-color: var(--text-main);
        }

        .node {
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .node-core {
            width: 32px;
            height: 32px;
            background-color: var(--bg-panel);
            border: 4px solid var(--text-muted);
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
        }

        .node.is-law .node-core { border-radius: 0; }
        .node:not(.is-law) .node-core {
            clip-path: polygon(20% 0, 80% 0, 100% 20%, 100% 80%, 80% 100%, 20% 100%, 0 80%, 0 20%);
        }

        .node-label {
            margin-top: 0.8rem;
            font-size: 1.3rem;
            color: var(--text-muted);
            text-transform: uppercase;
            white-space: nowrap;
            background: var(--bg-base);
            padding: 0 4px;
        }

        .node-year {
            font-family: var(--font-ui);
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.3rem;
            text-shadow: 2px 2px 0px #000;
        }

        .node.active .node-year { color: var(--text-main); }
        .node.active .node-label { color: var(--accent); }
        .node.active .node-core {
            border-color: var(--text-main);
            background-color: var(--accent);
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Nový panáček pro PC: stojí nohama přesně nad středem milníku */
        .player {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 20;
            width: 24px;
            height: 32px;
            margin-left: -12px;
            margin-top: -50px;
            background-color: transparent;
            box-shadow: 
                6px 0px 0 6px var(--accent),
                6px 6px 0 6px var(--text-main),
                6px 16px 0 6px var(--accent),
                0px 22px 0 4px var(--text-main),
                12px 22px 0 4px var(--text-main);
            transform-origin: bottom center;
            transition: transform 0.1s;
            pointer-events: none;
        }

        .player.walking { animation: walk 0.2s steps(2) infinite; }
        @keyframes walk {
            0% { transform: translateY(0); }
            100% { transform: translateY(-6px); }
        }

        .c-type {
            font-family: var(--font-ui);
            font-size: 0.7rem;
            color: var(--accent);
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }

        .c-title {
            font-family: var(--font-ui);
            font-size: 1.5rem;
            color: var(--text-main);
            line-height: 1.4;
            margin-bottom: 1rem;
        }

        .c-act {
            font-size: 1.6rem;
            color: var(--accent);
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 4px dashed var(--text-muted);
        }

        .c-desc {
            font-size: 1.4rem;
            line-height: 1.5;
            color: var(--text-main);
            margin-bottom: 2rem;
        }

        .c-bullets { list-style: none; margin-bottom: 2rem; }
        .c-bullets li {
            position: relative;
            padding-left: 2rem;
            margin-bottom: 1rem;
            color: var(--text-muted);
            font-size: 1.3rem;
            line-height: 1.4;
        }
        .c-bullets li::before {
            content: '>';
            position: absolute;
            left: 0;
            font-family: var(--font-ui);
            color: var(--accent);
            font-size: 1rem;
        }

        .sys-blocks {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }
        .sys-box {
            background-color: rgba(0,0,0,0.25);
            border: 4px solid var(--text-muted);
            padding: 1.5rem;
        }
        .sys-box-title {
            font-family: var(--font-ui);
            color: var(--accent);
            font-size: 0.75rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }
        .sys-box-text {
            font-size: 1.3rem;
            line-height: 1.4;
            color: var(--text-main);
        }

        .fact-box {
            background-color: rgba(242, 92, 56, 0.1);
            border: 4px solid var(--accent);
            padding: 1.5rem;
            margin-top: auto;
            position: relative;
        }
        .fact-box::before {
            content: "ZAJÍMAVOST";
            position: absolute;
            top: -12px;
            left: 1rem;
            background-color: var(--bg-panel);
            color: var(--accent);
            font-family: var(--font-ui);
            font-size: 0.7rem;
            padding: 0 0.5rem;
        }
        .fact-text {
            font-size: 1.3rem;
            line-height: 1.4;
            color: var(--text-main);
        }

        /* Pravidla pro mobilní zobrazení */
        @media (max-width: 800px) {
            body {
                flex-direction: column;
            }
            .game-view {
                height: 50vh;
                flex: none;
            }
            .codex {
                width: 100%;
                height: 50vh;
                border-left: none;
                border-top: 4px solid var(--accent);
                padding: 1rem; 
            }
            .hud {
                top: 0.5rem;
                left: 0.5rem;
            }
            h1 {
                font-size: 0.8rem;
                margin-bottom: 0.2rem;
            }
            .subtitle {
                font-size: 0.6rem;
            }
            .party-hud {
                top: 0.5rem;
                right: 0.5rem;
                min-width: auto;
                max-width: 55%;
                padding: 0.5rem;
                gap: 0.5rem;
                border-width: 2px;
                transform: scale(0.7);
                transform-origin: top right;
            }
            .controls {
                bottom: 0.5rem;
                left: 0;
                width: 100%;
                justify-content: center;
                gap: 0.5rem;
            }
            .btn {
                padding: 0.5rem 1rem;
                font-size: 0.6rem;
                border-width: 2px;
            }
            .player {
                transform: scale(0.75);
                margin-top: -44px;
                margin-left: -12px;
            }
            .node-core {
                width: 24px;
                height: 24px;
                border-width: 3px;
            }
            .node-label {
                font-size: 0.65rem;
                margin-top: 0.4rem;
                white-space: normal;
                max-width: 110px;
                text-align: center;
                line-height: 1.15;
            }
            .node-year {
                font-size: 0.55rem;
                margin-top: 0.2rem;
            }
            .c-type {
                font-size: 0.6rem;
                margin-bottom: 0.5rem;
            }
            .c-title {
                font-size: 1rem;
                margin-bottom: 0.5rem;
            }
            .c-act {
                font-size: 0.9rem;
                margin-bottom: 0.8rem;
                padding-bottom: 0.5rem;
                border-bottom-width: 2px;
            }
            .c-desc {
                font-size: 0.85rem;
                margin-bottom: 1rem;
            }
            .c-bullets {
                margin-bottom: 1rem;
            }
            .c-bullets li {
                font-size: 0.8rem;
                padding-left: 1.2rem;
                margin-bottom: 0.5rem;
            }
            .c-bullets li::before {
                font-size: 0.7rem;
            }
            .sys-blocks {
                gap: 0.8rem;
                margin-bottom: 1.5rem;
            }
            .sys-box {
                padding: 0.8rem;
                border-width: 2px;
            }
            .sys-box-title {
                font-size: 0.6rem;
                margin-bottom: 0.5rem;
            }
            .sys-box-text {
                font-size: 0.85rem;
            }
            .fact-box {
                padding: 0.8rem;
                border-width: 2px;
            }
            .fact-box::before {
                font-size: 0.5rem;
                top: -9px;
                padding: 0 0.3rem;
            }
            .fact-text {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <div class="game-view" id="game-view">
        <div class="hud">
            <h1>Ústavní cesta</h1>
            <div class="subtitle">Verze 1.6</div>
        </div>

        <div class="party-hud" id="party-hud">
            <!-- Dynamicky generováno -->
        </div>

        <div class="player" id="player"></div>
        <div class="world-container" id="world"></div>

        <div class="controls">
            <button class="btn" id="btn-prev" onclick="move(-1)">[A] VLEVO</button>
            <button class="btn" id="btn-next" onclick="move(1)">[D] VPRAVO</button>
        </div>
    </div>

    <div class="codex" id="codex">
        <div class="c-type" id="c-type">SYS.INFO</div>
        <h2 class="c-title" id="c-title">Název</h2>
        <div class="c-act" id="c-act">Zákon</div>
        
        <p class="c-desc" id="c-desc">Popis</p>
        <ul class="c-bullets" id="c-bullets"></ul>
        
        <div class="sys-blocks">
            <div class="sys-box" id="c-parl-box">
                <div class="sys-box-title">► ZÁKONODÁRNÝ SBOR</div>
                <div class="sys-box-text" id="c-parl-content"></div>
            </div>
            <div class="sys-box" id="c-court-box">
                <div class="sys-box-title">► SOUSTAVA SOUDŮ</div>
                <div class="sys-box-text" id="c-court-content"></div>
            </div>
        </div>

        <div class="fact-box" id="c-fact-box">
            <p class="fact-text" id="c-fact-content">Zajímavost</p>
        </div>
    </div>

    <script>
        const timeline = [
            { 
                year: "1918–1920", x: 400, y: 1000, 
                title: "Vznik republiky", 
                act: "Zákon č. 11/1918 Sb. a č. 37/1918 Sb.", 
                desc: "Recepční norma zajistila kontinuitu právního řádu převzetím rakousko-uherských předpisů. Následná Prozatímní ústava vytvořila systém nejvyšších orgánů státní moci a formálně nahradila monarchii republikou.", 
                bullets: [
                    "Svěření nejvyšší zákonodárné moci Národnímu výboru.", 
                    "Zakotvení republikánské formy státu.", 
                    "Právní dualismus (rakouské právo v Čechách, uherské na Slovensku)."
                ],
                leaders: [
                    { 
                        role: "Prezident", icon: "P", 
                        members: [
                            { name: "T. G. Masaryk", term: "1918–1920" }
                        ] 
                    },
